<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288"
     role="img" aria-labelledby="title description">
  <title id="title">q-ED-BO: heavier tails, wider confidence</title>
  <desc id="description">Schematic of a shared GP location with narrow dashed Gaussian
    confidence bounds at q = 2 and wider red bounds at q less than 2. Purple points
    show ordinary observations. A red extreme observation lies outside the Gaussian
    band and inside the wider band. The GP location stays fixed.</desc>
  <style>
    .confidence { animation: confidence 9s ease-in-out infinite; }
    .extreme { animation: extreme 9s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center;
             animation: halo 9s ease-out infinite; }
    @keyframes confidence {
      0%, 12%, 100% { opacity: .25; }
      35%, 85% { opacity: 1; }
    }
    @keyframes extreme {
      0%, 18%, 100% { opacity: .3; }
      32%, 85% { opacity: 1; }
    }
    @keyframes halo {
      0%, 25%, 75%, 100% { opacity: 0; transform: scale(.7); }
      38% { opacity: .5; transform: scale(1); }
      65% { opacity: 0; transform: scale(1.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .confidence, .extreme, .halo { animation: none; }
      .halo { opacity: 0; }
    }
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect width="512" height="288" fill="#f7f7f7"/>
