<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A modular agentic optimization architecture</title>
  <desc id="desc">Sara controls optimization policy, lenz maintains persistent state and Bayesian inference, and CAKE separately evolves the surrogate kernel.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a365d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3973bd"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#805ad5"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Two reasoning processes, one persistent state</text>
  <text x="600" y="91" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526077">Campaign strategy and kernel evolution remain separate while sharing observations</text>

  <g font-family="Inter,Arial,sans-serif">
    <g font-size="13" font-weight="700" letter-spacing="1.6">
      <text x="190" y="143" text-anchor="middle" fill="#285f9d">POLICY REASONING</text>
      <text x="600" y="143" text-anchor="middle" fill="#526077">OPTIMIZATION SUBSTRATE</text>
      <text x="1010" y="143" text-anchor="middle" fill="#6843a0">MODEL REASONING</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="60" y="170" width="280" height="450" rx="22" fill="#dbeafe" stroke="#3973bd" stroke-width="2"/>
      <rect x="390" y="170" width="420" height="500" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="860" y="170" width="280" height="450" rx="22" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    </g>

    <circle cx="200" cy="255" r="52" fill="#ffffff" stroke="#3973bd" stroke-width="3"/>
    <text x="200" y="270" text-anchor="middle" font-size="38" font-weight="700" fill="#3973bd">S</text>
    <text x="200" y="337" text-anchor="middle" font-size="25" font-weight="700" fill="#173b6c">Sara</text>
    <text x="200" y="366" text-anchor="middle" font-size="15" fill="#294d78">campaign LLM</text>
    <path d="M98 402 H302" stroke="#93c5fd" stroke-width="2"/>
    <text x="98" y="438" font-size="15" font-weight="700" fill="#174f8a">interprets</text>
    <text x="98" y="464" font-size="14" fill="#294d78">context / requirements / evidence</text>
    <text x="98" y="510" font-size="15" font-weight="700" fill="#174f8a">decides</text>
    <text x="98" y="536" font-size="14" fill="#294d78">probe / reconfigure / commit</text>

    <text x="600" y="222" text-anchor="middle" font-size="25" font-weight="700" fill="#2d3748">lenz</text>
    <text x="600" y="250" text-anchor="middle" font-size="14" fill="#526077">structured CLI + BoTorch backend</text>
    <rect x="435" y="282" width="330" height="62" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#455468">create / suggest / submit / observe</text>
    <text x="600" y="331" text-anchor="middle" font-size="13" fill="#64748b">diagnostics / predict / set-* / status</text>
    <path d="M435 382 H765" stroke="#cbd5e1" stroke-width="2"/>
    <text x="455" y="416" font-size="13" font-weight="700" letter-spacing="1.5" fill="#526077">PERSISTENT FRAME</text>

    <rect x="450" y="448" width="135" height="152" rx="14" fill="#fef3c7" stroke="#d7a83d" stroke-width="2"/>
    <text x="517" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#744b0b">trial log</text>
    <text x="517" y="524" text-anchor="middle" font-size="23" font-style="italic" fill="#744b0b">D(t)</text>
    <text x="517" y="561" text-anchor="middle" font-size="13" fill="#805d1b">configs + outcomes</text>
    <text x="517" y="582" text-anchor="middle" font-size="13" fill="#805d1b">never discarded</text>

    <rect x="615" y="448" width="135" height="152" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="682" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#455468">mutable shelf</text>
    <text x="682" y="520" text-anchor="middle" font-size="13" fill="#526077">space / bounds</text>
    <text x="682" y="546" text-anchor="middle" font-size="13" fill="#526077">objectives / constraints</text>
    <text x="682" y="572" text-anchor="middle" font-size="13" fill="#526077">surrogate / acquisition</text>
    <path d="M585 524 H615" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <circle cx="1000" cy="255" r="52" fill="#ffffff" stroke="#805ad5" stroke-width="3"/>
    <text x="1000" y="270" text-anchor="middle" font-size="38" font-weight="700" fill="#805ad5">K</text>
    <text x="1000" y="337" text-anchor="middle" font-size="25" font-weight="700" fill="#44337a">CAKE</text>
    <text x="1000" y="366" text-anchor="middle" font-size="15" fill="#5d477c">kernel LLM</text>
    <path d="M898 402 H1102" stroke="#c4b5d9" stroke-width="2"/>
    <text x="898" y="438" font-size="15" font-weight="700" fill="#553287">evolves</text>
    <text x="898" y="464" font-size="14" fill="#5d477c">kernel population</text>
    <text x="898" y="510" font-size="15" font-weight="700" fill="#553287">ranks</text>
    <text x="898" y="536" font-size="14" fill="#5d477c">BIC x acquisition utility</text>
  </g>

  <path d="M340 285 H390" stroke="#3973bd" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M390 345 H340" stroke="#3973bd" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M810 285 H860" stroke="#805ad5" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <path d="M860 345 H810" stroke="#805ad5" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <g font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">
    <text x="365" y="272" fill="#285f9d">actions</text>
    <text x="365" y="371" fill="#285f9d">JSON</text>
    <text x="835" y="272" fill="#6843a0">data</text>
    <text x="835" y="371" fill="#6843a0">kernels</text>
  </g>

  <rect x="120" y="700" width="960" height="40" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="725" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#455468">Sara never sees kernel-generation context; CAKE never sees campaign deliberation</text>
</svg>
