<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Standard and agent-controlled Bayesian optimization</title>
  <desc id="desc">Standard Bayesian optimization follows a fixed loop. Agentic Bayesian optimization can inspect and revise the policy before committing an expensive evaluation.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a365d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3973bd"/>
    </marker>
  </defs>

  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">From a prescribed step to a deliberative search</text>
  <text x="600" y="91" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526077">Both retain a probabilistic surrogate; only one can revise how it is used</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="55" y="130" width="520" height="490" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="625" y="130" width="520" height="490" rx="22" fill="#eff6ff" stroke="#3973bd" stroke-width="2"/>

    <text x="92" y="175" font-size="13" font-weight="700" letter-spacing="1.8" fill="#64748b">FIXED POLICY</text>
    <text x="92" y="211" font-size="24" font-weight="700" fill="#2d3748">Standard Bayesian optimization</text>

    <g filter="url(#shadow)" fill="#ffffff" stroke="#718096" stroke-width="2.5">
      <circle cx="155" cy="340" r="52"/>
      <circle cx="315" cy="340" r="52"/>
      <circle cx="475" cy="340" r="52" fill="#fef3c7" stroke="#b7791f"/>
    </g>
    <path d="M207 340 H253 M367 340 H413" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g text-anchor="middle">
      <text x="155" y="334" font-size="15" font-weight="700" fill="#2d3748">fit</text>
      <text x="155" y="355" font-size="13" fill="#526077">posterior</text>
      <text x="315" y="334" font-size="15" font-weight="700" fill="#2d3748">maximize</text>
      <text x="315" y="355" font-size="13" fill="#526077">acquisition</text>
      <text x="475" y="334" font-size="15" font-weight="700" fill="#744b0b">evaluate</text>
      <text x="475" y="355" font-size="13" fill="#805d1b">h(x)</text>
    </g>
    <path d="M475 395 C475 478 155 478 155 395" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="315" y="483" text-anchor="middle" font-size="14" fill="#526077">append the observation and repeat</text>
    <rect x="105" y="522" width="420" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="315" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#455468">surrogate / acquisition / bounds / objectives</text>
    <text x="315" y="568" text-anchor="middle" font-size="13" fill="#64748b">fixed before the campaign</text>

    <text x="662" y="175" font-size="13" font-weight="700" letter-spacing="1.8" fill="#285f9d">ADAPTIVE POLICY</text>
    <text x="662" y="211" font-size="24" font-weight="700" fill="#173b6c">Agentic Bayesian optimization</text>

    <g filter="url(#shadow)">
      <circle cx="710" cy="340" r="48" fill="#ffffff" stroke="#3973bd" stroke-width="2.5"/>
      <circle cx="875" cy="340" r="72" fill="#e9d8fd" stroke="#805ad5" stroke-width="2.5"/>
      <circle cx="1065" cy="340" r="48" fill="#fef3c7" stroke="#b7791f" stroke-width="2.5"/>
    </g>
    <path d="M758 340 H795 M947 340 H1007" stroke="#3973bd" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <g text-anchor="middle">
      <text x="710" y="334" font-size="14" font-weight="700" fill="#173b6c">Bayesian</text>
      <text x="710" y="355" font-size="13" fill="#294d78">backend</text>
      <text x="875" y="315" font-size="20" font-weight="700" fill="#44337a">agent</text>
      <text x="875" y="343" font-size="13" fill="#5d477c">probe / compare</text>
      <text x="875" y="365" font-size="13" fill="#5d477c">reconfigure / commit</text>
      <text x="1065" y="334" font-size="14" font-weight="700" fill="#744b0b">evaluate</text>
      <text x="1065" y="355" font-size="13" fill="#805d1b">h(x)</text>
    </g>
    <path d="M1065 390 C1065 482 710 482 710 390" fill="none" stroke="#3973bd" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="887" y="487" text-anchor="middle" font-size="14" fill="#294d78">observations and instructions return</text>
    <rect x="665" y="522" width="440" height="58" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="885" y="547" text-anchor="middle" font-size="14" font-weight="700" fill="#173b6c">configuration c(t) remains editable</text>
    <text x="885" y="568" text-anchor="middle" font-size="13" fill="#294d78">previous trials remain valid</text>
  </g>
</svg>
