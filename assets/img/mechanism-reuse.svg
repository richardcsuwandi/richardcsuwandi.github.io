<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Mechanism reuse across environments</title>
  <desc id="desc">A shared mechanism is combined with different variables, parameters, and binding structures across three environments, avoiding the need to relearn separate monolithic predictors.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a365d" flood-opacity=".13"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="640" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">One mechanism, many environments</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526077">Compositional models reuse stable scientific knowledge and relearn only what changes</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#s)">
    <rect x="80" y="180" width="275" height="275" rx="24" fill="#dcfce7" stroke="#348754" stroke-width="3"/>
    <text x="217" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#195b34">Shared mechanism</text>
    <circle cx="217" cy="315" r="58" fill="#ffffff" stroke="#348754" stroke-width="3"/>
    <text x="217" y="326" text-anchor="middle" font-size="34" font-weight="700" fill="#195b34">fₖ</text>
    <text x="217" y="405" text-anchor="middle" font-size="16" fill="#276741">encoded once</text>

    <rect x="485" y="130" width="630" height="120" rx="20" fill="#dbeafe" stroke="#3973bd" stroke-width="2"/>
    <text x="530" y="172" font-size="21" font-weight="700" fill="#173b6c">Environment E₁</text>
    <text x="530" y="207" font-size="16" fill="#294d78">variables V₁, binding G₁, parameters Θ₁</text>
    <rect x="935" y="155" width="135" height="70" rx="15" fill="#ffffff" stroke="#3973bd" stroke-width="2"/>
    <text x="1002" y="197" text-anchor="middle" font-size="18" font-weight="700" fill="#173b6c">system 1</text>

    <rect x="485" y="275" width="630" height="120" rx="20" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    <text x="530" y="317" font-size="21" font-weight="700" fill="#44337a">Environment E₂</text>
    <text x="530" y="352" font-size="16" fill="#553c9a">variables V₂, binding G₂, parameters Θ₂</text>
    <rect x="935" y="300" width="135" height="70" rx="15" fill="#ffffff" stroke="#805ad5" stroke-width="2"/>
    <text x="1002" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#44337a">system 2</text>

    <rect x="485" y="420" width="630" height="120" rx="20" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="530" y="462" font-size="21" font-weight="700" fill="#744b0b">Environment E₃</text>
    <text x="530" y="497" font-size="16" fill="#805d1b">variables V₃, binding G₃, parameters Θ₃</text>
    <rect x="935" y="445" width="135" height="70" rx="15" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
    <text x="1002" y="487" text-anchor="middle" font-size="18" font-weight="700" fill="#744b0b">system 3</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)">
    <path d="M355 285 C410 260 425 190 485 190"/>
    <path d="M355 315 H485"/>
    <path d="M355 345 C410 370 425 480 485 480"/>
  </g>
  <rect x="105" y="500" width="300" height="72" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="255" y="529" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#334155">Minimum description length</text>
  <text x="255" y="555" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#526077">pay once, then specify each binding</text>
</svg>
