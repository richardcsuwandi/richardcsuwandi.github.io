<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The open scientific discovery loop</title>
  <desc id="desc">A scientific world model links hypothesis proposal, Bayesian inference, experiment design, execution, and predictive checking, with model failure expanding the hypothesis space.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a365d" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#1a202c">A scientific world model in action</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#4a5568">The discovery loop can revise beliefs inside a model class or revise the class itself</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#s)">
    <rect x="90" y="150" width="245" height="105" rx="18" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    <text x="212" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#44337a">Propose hypotheses</text>
    <text x="212" y="220" text-anchor="middle" font-size="15" fill="#553c9a">structures + mechanisms</text>

    <rect x="478" y="125" width="245" height="105" rx="18" fill="#dbeafe" stroke="#3973bd" stroke-width="2"/>
    <text x="600" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#173b6c">Infer beliefs</text>
    <text x="600" y="195" text-anchor="middle" font-size="15" fill="#294d78">posterior over M and θ</text>

    <rect x="865" y="150" width="245" height="105" rx="18" fill="#dcfce7" stroke="#348754" stroke-width="2"/>
    <text x="987" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#195b34">Design experiment</text>
    <text x="987" y="220" text-anchor="middle" font-size="15" fill="#276741">information, cost, and risk</text>

    <rect x="865" y="400" width="245" height="105" rx="18" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="987" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#744b0b">Execute + observe</text>
    <text x="987" y="470" text-anchor="middle" font-size="15" fill="#805d1b">physical action + provenance</text>

    <rect x="478" y="425" width="245" height="105" rx="18" fill="#fee2e2" stroke="#c53030" stroke-width="2"/>
    <text x="600" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#822727">Predictive check</text>
    <text x="600" y="495" text-anchor="middle" font-size="15" fill="#9b2c2c">Can a current model reproduce it?</text>

    <rect x="90" y="400" width="245" height="105" rx="18" fill="#edf2f7" stroke="#718096" stroke-width="2"/>
    <text x="212" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3748">Update model</text>
    <text x="212" y="470" text-anchor="middle" font-size="15" fill="#4a5568">parameters or structure</text>

    <rect x="365" y="610" width="470" height="70" rx="18" fill="#fff5f5" stroke="#e53e3e" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="600" y="640" text-anchor="middle" font-size="20" font-weight="700" fill="#9b2c2c">Expand the hypothesis space</text>
    <text x="600" y="665" text-anchor="middle" font-size="15" fill="#9b2c2c">new variable, mechanism, or vocabulary</text>
  </g>

  <g fill="none" stroke="#4a5568" stroke-width="3" marker-end="url(#arr)">
    <path d="M335 190 C390 170 420 165 478 170"/>
    <path d="M723 170 C780 165 815 175 865 190"/>
    <path d="M1035 255 C1080 310 1080 345 1035 400"/>
    <path d="M865 465 C810 485 775 490 723 480"/>
    <path d="M478 480 C420 490 385 480 335 465"/>
    <path d="M160 400 C115 350 120 305 175 255"/>
  </g>
  <path d="M600 530 V610" fill="none" stroke="#e53e3e" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arr)"/>
  <text x="620" y="572" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#c53030">all models fail</text>
  <path d="M365 645 C220 640 145 590 185 505" fill="none" stroke="#e53e3e" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arr)"/>
</svg>
