<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Three signals for directing curiosity</title>
  <desc id="desc">Surprise values unexpected observations, information gain values changes in beliefs, and empowerment values actions that create controllable future options. A meta-controller balances all three against task value, cost, and risk.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="var(--muted)"/>
    </marker>
    <style>
      .art {
        --text: #20272d; --muted: #4b545c; --line: #d7dde2; --surface: #ffffff;
        --panel: #f7f9fa; --blue: #477fae; --blue-soft: #e5eff8; --orange: #c77438;
        --orange-soft: #faeadc; --green: #3f8a66; --green-soft: #e4f2e9; --purple: #7765a7;
        --purple-soft: #ece8f5;
        font-family: Arial, Helvetica, sans-serif;
      }
      #dark:target ~ .art {
        --text: #eef2f5; --muted: #c1cad1; --line: #3a4650; --surface: #202830;
        --panel: #182028; --blue: #77acd7; --blue-soft: #253b4d; --orange: #e49a63;
        --orange-soft: #463326; --green: #73bd92; --green-soft: #263d31; --purple: #ab9bd2;
        --purple-soft: #373247;
      }
      .heading { fill: var(--text); font-size: 40px; font-weight: 700; }
      .kicker { font-size: 15px; font-weight: 700; letter-spacing: 1.1px; }
      .card-title { fill: var(--text); font-size: 30px; font-weight: 700; }
      .question { fill: var(--text); font-size: 20px; font-weight: 700; }
      .body { fill: var(--muted); font-size: 19px; }
      .small { fill: var(--muted); font-size: 15px; }
      .mono { fill: var(--text); font-family: "Courier New", Courier, monospace; font-size: 16px; }
      .hairline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: var(--muted); stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <g id="dark"/>
  <g class="art">
    <rect width="1200" height="680" fill="var(--panel)" rx="22"/>
    <text x="600" y="58" text-anchor="middle" class="heading">Curiosity needs a direction</text>

    <!-- Surprise -->
    <g transform="translate(42 100)">
      <rect width="348" height="410" rx="18" fill="var(--surface)" stroke="var(--line)"/>
      <rect width="348" height="7" rx="3.5" fill="var(--orange)"/>
      <text x="24" y="44" class="kicker" fill="var(--orange)">OBSERVATION-LEVEL</text>
      <text x="24" y="84" class="card-title">Surprise</text>
      <text x="24" y="116" class="question">Was it unexpected?</text>

      <g transform="translate(24 142)">
        <rect width="300" height="118" rx="12" fill="var(--orange-soft)"/>
        <text x="150" y="24" text-anchor="middle" class="small">prediction error</text>
        <path d="M18 92C38 86 48 90 66 80S95 69 111 78S137 97 154 73S178 61 193 75S222 94 238 58S267 47 282 40" fill="none" stroke="var(--orange)" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 96H282" class="hairline" opacity=".7"/>
        <circle cx="238" cy="58" r="6" fill="var(--orange)"/>
      </g>
      <text x="24" y="304" class="body">Rewards hard-to-predict outcomes.</text>
      <text x="24" y="342" class="small">Blind spot</text>
      <text x="24" y="370" class="body" fill="var(--text)">Noise can stay surprising</text>
      <text x="24" y="394" class="body" fill="var(--text)">forever.</text>
    </g>

    <!-- Information gain -->
    <g transform="translate(426 100)">
      <rect width="348" height="410" rx="18" fill="var(--surface)" stroke="var(--line)"/>
      <rect width="348" height="7" rx="3.5" fill="var(--blue)"/>
      <text x="24" y="44" class="kicker" fill="var(--blue)">BELIEF-LEVEL</text>
      <text x="24" y="84" class="card-title">Information gain</text>
      <text x="24" y="116" class="question">Did beliefs change?</text>

      <g transform="translate(24 142)">
        <rect width="300" height="118" rx="12" fill="var(--blue-soft)"/>
        <text x="18" y="27" class="small">before</text>
        <rect x="18" y="39" width="72" height="16" rx="8" fill="var(--blue)" opacity=".85"/>
        <rect x="18" y="61" width="72" height="16" rx="8" fill="var(--blue)" opacity=".55"/>
        <rect x="18" y="83" width="72" height="16" rx="8" fill="var(--blue)" opacity=".3"/>
        <path d="M108 65H172" class="arrow"/>
        <text x="204" y="27" class="small">after</text>
        <rect x="204" y="39" width="72" height="16" rx="8" fill="var(--blue)"/>
        <rect x="204" y="61" width="19" height="16" rx="8" fill="var(--blue)" opacity=".35"/>
        <rect x="204" y="83" width="10" height="16" rx="8" fill="var(--blue)" opacity=".2"/>
      </g>
      <text x="24" y="304" class="body">Rewards posterior change.</text>
      <text x="24" y="342" class="small">Blind spot</text>
      <text x="24" y="370" class="body" fill="var(--text)">Learnable trivia may not</text>
      <text x="24" y="394" class="body" fill="var(--text)">matter.</text>
    </g>

    <!-- Empowerment -->
    <g transform="translate(810 100)">
      <rect width="348" height="410" rx="18" fill="var(--surface)" stroke="var(--line)"/>
      <rect width="348" height="7" rx="3.5" fill="var(--green)"/>
      <text x="24" y="44" class="kicker" fill="var(--green)">FUTURE-LEVEL</text>
      <text x="24" y="84" class="card-title">Empowerment</text>
      <text x="24" y="116" class="question">Did it open options?</text>

      <g transform="translate(24 142)">
        <rect width="300" height="118" rx="12" fill="var(--green-soft)"/>
        <circle cx="42" cy="59" r="11" fill="var(--green)"/>
        <path d="M55 59H104M104 59C134 59 137 26 170 26M104 59H170M104 59C134 59 137 92 170 92" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="178" cy="26" r="9" fill="var(--surface)" stroke="var(--green)" stroke-width="2.6"/>
        <circle cx="178" cy="59" r="9" fill="var(--surface)" stroke="var(--green)" stroke-width="2.6"/>
        <circle cx="178" cy="92" r="9" fill="var(--surface)" stroke="var(--green)" stroke-width="2.6"/>
        <path d="M188 26H222M188 59H252M188 92H235" fill="none" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="228" cy="26" r="6.5" fill="var(--green)" opacity=".75"/>
        <circle cx="258" cy="59" r="6.5" fill="var(--green)"/>
        <circle cx="241" cy="92" r="6.5" fill="var(--green)" opacity=".75"/>
      </g>
      <text x="24" y="304" class="body">Rewards controllable futures.</text>
      <text x="24" y="342" class="small">Blind spot</text>
      <text x="24" y="370" class="body" fill="var(--text)">More options can distract</text>
      <text x="24" y="394" class="body" fill="var(--text)">from the goal.</text>
    </g>

    <!-- Meta-controller -->
    <path d="M216 510V545M600 510V545M984 510V545" class="arrow"/>
    <g transform="translate(72 557)">
      <rect width="1056" height="106" rx="18" fill="var(--surface)" stroke="var(--purple)" stroke-width="1.5"/>
      <rect x="18" y="16" width="222" height="74" rx="12" fill="var(--purple-soft)"/>
      <text x="129" y="46" text-anchor="middle" class="kicker" fill="var(--purple)">META-CONTROLLER</text>
      <text x="129" y="71" text-anchor="middle" class="body" fill="var(--text)">choose the signal now</text>
      <path d="M262 53H314" class="arrow"/>
      <text x="338" y="37" class="small">condition on</text>
      <text x="338" y="62" class="mono">belief · budget · bottleneck</text>
      <text x="338" y="84" class="mono">task value · cost · risk</text>
      <path d="M718 53H770" class="arrow"/>
      <rect x="791" y="22" width="247" height="62" rx="12" fill="var(--blue-soft)"/>
      <text x="914.5" y="48" text-anchor="middle" class="small">output</text>
      <text x="914.5" y="71" text-anchor="middle" class="body" fill="var(--text)">a decision-relevant action</text>
    </g>
  </g>
</svg>
