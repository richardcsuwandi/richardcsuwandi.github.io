<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Variable, mechanism, and structure discovery</title>
  <desc id="desc">Raw observations become scientific variables, reusable mechanisms, and a binding structure, with interventions testing the resulting organization.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a365d" flood-opacity=".13"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Discovering a scientific representation</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526077">The challenge is not only to compress observations, but to find stable parts and relations</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#s)">
    <rect x="55" y="160" width="245" height="285" rx="22" fill="#edf2f7" stroke="#718096" stroke-width="2"/>
    <text x="177" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#2d3748">Observations</text>
    <path d="M90 270 C120 225 145 330 175 280 S230 225 265 290" fill="none" stroke="#718096" stroke-width="4"/>
    <g fill="#718096"><circle cx="105" cy="360" r="8"/><circle cx="140" cy="335" r="8"/><circle cx="175" cy="375" r="8"/><circle cx="215" cy="345" r="8"/><circle cx="250" cy="385" r="8"/></g>
    <text x="177" y="420" text-anchor="middle" font-size="16" fill="#4a5568">pixels, spectra, and trajectories</text>

    <rect x="350" y="160" width="245" height="285" rx="22" fill="#dbeafe" stroke="#3973bd" stroke-width="2"/>
    <text x="472" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#173b6c">Variables</text>
    <circle cx="420" cy="290" r="30" fill="#ffffff" stroke="#3973bd" stroke-width="3"/>
    <circle cx="525" cy="290" r="30" fill="#ffffff" stroke="#3973bd" stroke-width="3"/>
    <text x="420" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#173b6c">v₁</text>
    <text x="525" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#173b6c">v₂</text>
    <text x="472" y="370" text-anchor="middle" font-size="16" fill="#294d78">stable scientific abstractions</text>
    <text x="472" y="401" text-anchor="middle" font-size="15" font-style="italic" fill="#3973bd">What should the state contain?</text>

    <rect x="645" y="160" width="245" height="285" rx="22" fill="#dcfce7" stroke="#348754" stroke-width="2"/>
    <text x="767" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#195b34">Mechanisms</text>
    <rect x="690" y="255" width="155" height="70" rx="35" fill="#ffffff" stroke="#348754" stroke-width="3"/>
    <text x="767" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#195b34">fₖ</text>
    <text x="767" y="370" text-anchor="middle" font-size="16" fill="#276741">reusable transformations</text>
    <text x="767" y="401" text-anchor="middle" font-size="15" font-style="italic" fill="#348754">How is change produced?</text>

    <rect x="940" y="160" width="205" height="285" rx="22" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    <text x="1042" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#44337a">Structure</text>
    <g fill="#ffffff" stroke="#805ad5" stroke-width="3"><circle cx="1000" cy="275" r="22"/><circle cx="1085" cy="275" r="22"/><circle cx="1042" cy="350" r="22"/></g>
    <path d="M1020 285 L1032 330 M1065 285 L1052 330 M1022 275 H1063" fill="none" stroke="#805ad5" stroke-width="3"/>
    <text x="1042" y="401" text-anchor="middle" font-size="15" font-style="italic" fill="#805ad5">Which parts connect?</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)">
    <path d="M300 302 H350"/><path d="M595 302 H645"/><path d="M890 302 H940"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#526077" text-anchor="middle">
    <text x="325" y="285">discover</text><text x="620" y="285">explain</text><text x="915" y="285">compose</text>
  </g>

  <path d="M1042 445 C1042 560 472 575 472 445" fill="none" stroke="#c53030" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a)"/>
  <rect x="465" y="510" width="575" height="70" rx="18" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="752" y="540" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#9b2c2c">Interventions test the whole representation</text>
  <text x="752" y="566" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#9b2c2c">Failure may reveal the wrong variable, mechanism, or connection</text>
</svg>
