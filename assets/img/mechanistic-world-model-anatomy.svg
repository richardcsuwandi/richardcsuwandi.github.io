<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a mechanistic world model</title>
  <desc id="desc">Variables, mechanisms, binding structure, parameters, and interventions combine into a mechanistic world model that supports prediction, explanation, intervention, transfer, and revision.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a365d" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Anatomy of a mechanistic world model</text>
  <text x="600" y="88" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#526077">Structured mechanisms can be inspected, tested, and reused</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="70" y="135" width="215" height="82" rx="16" fill="#dbeafe" stroke="#3973bd" stroke-width="2"/>
    <text x="177" y="169" text-anchor="middle" font-size="23" font-weight="700" fill="#173b6c">V</text>
    <text x="177" y="197" text-anchor="middle" font-size="16" fill="#294d78">scientific variables</text>

    <rect x="70" y="242" width="215" height="82" rx="16" fill="#dcfce7" stroke="#348754" stroke-width="2"/>
    <text x="177" y="276" text-anchor="middle" font-size="23" font-weight="700" fill="#195b34">F = {fₖ}</text>
    <text x="177" y="304" text-anchor="middle" font-size="16" fill="#276741">mechanism library</text>

    <rect x="70" y="349" width="215" height="82" rx="16" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    <text x="177" y="383" text-anchor="middle" font-size="23" font-weight="700" fill="#44337a">G</text>
    <text x="177" y="411" text-anchor="middle" font-size="16" fill="#553c9a">binding structure</text>

    <rect x="70" y="456" width="215" height="82" rx="16" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <text x="177" y="490" text-anchor="middle" font-size="23" font-weight="700" fill="#744b0b">Θ</text>
    <text x="177" y="518" text-anchor="middle" font-size="16" fill="#805d1b">uncertain parameters</text>

    <rect x="70" y="563" width="215" height="82" rx="16" fill="#fee2e2" stroke="#c53030" stroke-width="2"/>
    <text x="177" y="597" text-anchor="middle" font-size="23" font-weight="700" fill="#822727">U</text>
    <text x="177" y="625" text-anchor="middle" font-size="16" fill="#9b2c2c">admissible interventions</text>

    <rect x="405" y="250" width="390" height="285" rx="28" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="600" y="295" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Composed scientific system</text>
    <circle cx="500" cy="370" r="25" fill="#dbeafe" stroke="#3973bd" stroke-width="2"/>
    <circle cx="600" cy="345" r="25" fill="#dcfce7" stroke="#348754" stroke-width="2"/>
    <circle cx="700" cy="385" r="25" fill="#e9d8fd" stroke="#805ad5" stroke-width="2"/>
    <circle cx="555" cy="455" r="25" fill="#fef3c7" stroke="#b7791f" stroke-width="2"/>
    <circle cx="660" cy="465" r="25" fill="#fee2e2" stroke="#c53030" stroke-width="2"/>
    <path d="M525 364 L575 351 M624 354 L676 377 M681 403 L669 441 M635 461 L580 457 M542 435 L512 393 M578 443 L588 370" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="600" y="510" text-anchor="middle" font-size="16" fill="#526077">mechanisms bound to variables at a chosen scale</text>

    <rect x="915" y="128" width="220" height="76" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="1025" y="174" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">Prediction</text>
    <rect x="915" y="229" width="220" height="76" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="1025" y="275" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">Explanation</text>
    <rect x="915" y="330" width="220" height="76" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="1025" y="376" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">Intervention</text>
    <rect x="915" y="431" width="220" height="76" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="1025" y="477" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">Transfer</text>
    <rect x="915" y="532" width="220" height="76" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="1025" y="578" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">Revision</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M285 176 C345 176 350 290 405 315"/>
    <path d="M285 283 C345 283 350 330 405 350"/>
    <path d="M285 390 H405"/>
    <path d="M285 497 C345 497 350 450 405 430"/>
    <path d="M285 604 C345 604 350 500 405 475"/>
    <path d="M795 390 H875"/>
  </g>
  <path d="M875 166 V570" fill="none" stroke="#64748b" stroke-width="3"/>
  <g fill="none" stroke="#64748b" stroke-width="2">
    <path d="M875 166 H915"/><path d="M875 267 H915"/><path d="M875 368 H915"/><path d="M875 469 H915"/><path d="M875 570 H915"/>
  </g>
</svg>
