<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenEvolve's evaluation loop, grounded by AlgoTune</title>
  <desc id="desc">OpenEvolve proposes a code change, evaluates it, and keeps the best candidate for the next generation. AlgoTune provides correctness checks against a reference and a runtime score across 30 tasks.</desc>

  <defs>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #e6eaee; }
      .heading { font-size: 30px; font-weight: 700; }
      .step { font-size: 21px; font-weight: 700; }
      .detail { font-size: 18px; }
      .note { font-size: 17px; font-weight: 700; }
      .arrow { font-size: 28px; font-weight: 700; }
    </style>
  </defs>

  <g class="sans">
    <rect x="10" y="10" width="410" height="340" rx="22" fill="#1a3348" stroke="#4a7aa3" stroke-width="1.4"/>
    <text x="34" y="52" class="heading" fill="#7eb4e3">OpenEvolve</text>

    <rect x="34" y="78" width="300" height="62" rx="13" fill="#14181c"/>
    <text x="56" y="116" class="step">1. Propose a code change</text>
    <text x="184" y="158" text-anchor="middle" class="arrow" fill="#6ea8d4">↓</text>

    <rect x="34" y="160" width="300" height="76" rx="13" fill="#6b757d"/>
    <text x="56" y="193" class="step" fill="#ffffff">2. Evaluate it</text>
    <text x="56" y="219" class="detail" fill="#ffffff">correctness + speed</text>
    <text x="184" y="254" text-anchor="middle" class="arrow" fill="#6ea8d4">↓</text>

    <rect x="34" y="256" width="300" height="62" rx="13" fill="#14181c"/>
    <text x="56" y="286" class="step">3. Keep the best candidate</text>
    <text x="56" y="311" class="detail" fill="#9aa5ae">seed the next generation</text>

    <rect x="480" y="10" width="410" height="340" rx="22" fill="#2a323a" stroke="#4d575f" stroke-width="1.4"/>
    <text x="504" y="52" class="heading" fill="#e89a5c">AlgoTune</text>

    <rect x="504" y="78" width="362" height="94" rx="13" fill="#2a221c" stroke="#6b5342" stroke-width="1.2"/>
    <text x="528" y="115" class="step">Correctness check</text>
    <text x="528" y="145" class="detail" fill="#c4b8ac">match the reference answer first</text>

    <rect x="504" y="190" width="362" height="94" rx="13" fill="#2a221c" stroke="#6b5342" stroke-width="1.2"/>
    <text x="528" y="227" class="step">Runtime score</text>
    <text x="528" y="257" class="detail" fill="#c4b8ac">measure only valid programs</text>

    <text x="685" y="322" text-anchor="middle" class="note" fill="#9aa5ae">30 tasks · one evaluation contract</text>
    <text x="450" y="208" text-anchor="middle" class="arrow" fill="#c9d0d6">←</text>
  </g>
</svg>
